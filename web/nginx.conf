server {
  listen 80;
  root /usr/share/nginx/html;

  # Vite fingerprints asset filenames, so a changed file is a new URL and these
  # can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing. /shows/:id/seats and /reservations/:id are React
  # routes, not files — serve the app and let React Router pick the page.
  location / {
    try_files $uri /index.html;
  }
}
