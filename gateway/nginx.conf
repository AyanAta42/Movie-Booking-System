# The API gateway: the single front door, routing by path.
#
# Locally this is nginx. On AWS it is replaced by an Application Load Balancer
# with the same rules — each `location` below becomes an ALB listener rule, and
# each upstream becomes a target group.

# Docker's internal DNS. Re-resolving every few seconds means replicas that are
# added (`--scale booking=3`) or restarted with a new IP are picked up without
# restarting the gateway.
resolver 127.0.0.11 valid=5s ipv6=off;

# Each service name resolves to every replica of that service. nginx spreads
# requests across them round-robin.
upstream browsing {
  zone browsing 64k;
  server browsing:4000 resolve;
}

upstream booking {
  zone booking 64k;
  server booking:4000 resolve;
}

upstream web {
  zone web 64k;
  server web:80 resolve;
}

server {
  listen 80;

  # Which replica answered, by IP. Paired with the X-Served-By header each
  # service sets itself, this makes the load balancing visible.
  add_header X-Upstream $upstream_addr always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Failover. When a replica dies, the gateway can still hold its IP for up to
  # the 5s DNS window above, and a connect to a vanished container hangs before
  # failing. Give up quickly and try the next replica. nginx only retries
  # idempotent requests (GET, HEAD…), never a POST — see the booking note below.
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout http_502 http_503;

  # Paths are passed through untouched: /api/movies arrives at browsing as
  # /api/movies, and the services answer under /api themselves. That is
  # deliberate — an AWS load balancer cannot rewrite paths, so doing it here
  # would make local behave differently from production.

  # ---- browsing: catalog reads --------------------------------------------
  location /api/movies  { proxy_pass http://browsing; }
  location /api/cinemas { proxy_pass http://browsing; }

  # ---- booking: seat state and reservations ---------------------------------
  # nginx does not retry a failed POST on another replica, which is correct:
  # a reservation that may have been half-processed must not be sent twice.
  # The client's idempotency key is what makes a retry safe, not the gateway.
  location /api/shows        { proxy_pass http://booking; }
  location /api/reservations { proxy_pass http://booking; }

  # Per-service health, for poking at from a browser.
  location = /api/health/browsing { proxy_pass http://browsing/health; }
  location = /api/health/booking  { proxy_pass http://booking/health; }

  # Anything else under /api is a route no service owns.
  location /api/ {
    default_type application/json;
    return 404 '{"error":"not_found","message":"No service handles this path"}';
  }

  # The gateway's own liveness check.
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- everything else: the website ---------------------------------------
  location / { proxy_pass http://web; }
}
